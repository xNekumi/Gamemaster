services:
  gamemaster:
    build: .
    container_name: gamemaster
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # WICHTIG: Vor dem produktiven Einsatz ein sicheres Passwort setzen!
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-gamemaster}"
      PORT: "3000"
    volumes:
      # Fragen und Konfiguration ohne Neubau anpassbar machen:
      - ./data/questions.json:/app/data/questions.json:ro
      - ./data/questions-hearts.json:/app/data/questions-hearts.json:ro
      - ./data/questions-wave.json:/app/data/questions-wave.json:ro
      - ./data/questions-jeopardy.json:/app/data/questions-jeopardy.json:ro
      - ./config/config.json:/app/config/config.json:ro
      # Eigene Medien (Bilder/Audio/Video) für Quiz-Duell -> erreichbar als /media/<datei>
      - ./public/media:/app/public/media:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
